    put:
      consumes:
      - application/json
      parameters:
      - description: Catégorie
        in: body
        name: payload
        schema:
          $ref: '#/definitions/domain.CategoryUpsert'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ResourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
