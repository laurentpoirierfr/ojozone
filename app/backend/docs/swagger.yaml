info:
  contact: {}
  description: |-
    API de comparaison du coût de la vie dans la zone euro.
    Les montants décimaux sont exposés sous forme de chaînes pour préserver leur précision.
  title: OjoZone API
  version: "1.0"
paths:
  /api/v1/admin/users:
    get:
      description: Lecture seule en l'absence d'authentification ; password_hash n'est
        jamais exposé.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ResourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Consulter les utilisateurs en administration
      tags:
      - Administration
  /api/v1/admin/users/{id}:
    get:
      description: Lecture seule en l'absence d'authentification ; password_hash n'est
        jamais exposé.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ResourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Consulter les utilisateurs en administration
      tags:
      - Administration
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Identifiants
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Ouvrir une session
      tags:
      - Authentification
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Jeton de rafraîchissement
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshInput'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Révoquer la session
      tags:
      - Authentification
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Un jeton de rafraîchissement ne peut être utilisé qu'une seule
        fois.
      parameters:
      - description: Jeton de rafraîchissement
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Renouveler les jetons
      tags:
      - Authentification
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Valide l'email, le mot de passe et la langue, puis retourne le
        profil et deux jetons.
      parameters:
      - description: Inscription
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Créer un compte et ouvrir une session
      tags:
      - Authentification
  /api/v1/categories:
    get:
      consumes:
      - application/json
      parameters:
      - description: Catégorie
        in: body
        name: payload
        schema:
          $ref: '#/definitions/domain.CategoryUpsert'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ResourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Gérer les catégories
      tags:
      - Catégories
    post:
      consumes:
      - application/json
      parameters:
      - description: Catégorie
        in: body
        name: payload
        schema:
          $ref: '#/definitions/domain.CategoryUpsert'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ResourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Gérer les catégories
      tags:
      - Catégories
  /api/v1/categories/{id}:
    delete:
