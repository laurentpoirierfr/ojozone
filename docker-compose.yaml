name: ojozone

services:
  postgres:
    image: docker.io/postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ojozone}
      POSTGRES_USER: ${POSTGRES_USER:-ojozone}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ojozone} -d ${POSTGRES_DB:-ojozone}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: docker.io/migrate/migrate:v4.19.0
    profiles: ["tools"]
    volumes:
      - ./deploy/migration/sql:/migrations:ro

  api:
    build:
      context: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://ojozone@postgres:5432/${POSTGRES_DB:-ojozone}?sslmode=disable&search_path=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-secret-do-not-use-in-production}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ops/readiness | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
