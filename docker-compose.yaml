name: ojozone

services:
  postgres:
    image: docker.io/postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ojozone}
      POSTGRES_USER: ${POSTGRES_USER:-ojozone}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ojozone} -d ${POSTGRES_DB:-ojozone}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: docker.io/migrate/migrate:v4.19.0
    profiles: ["tools"]
    volumes:
      - ./deploy/migration/sql:/migrations:ro

volumes:
  postgres-data:
